# SPDX-License-Identifier: Apache-2.0
#
# vexec's Compose project: the images vexec is built and tested in, and the
# containers its suites run in (test/vexec/run.sh drives it).  Nothing is
# installed on the host.
#
#   vexec-dev-vanilla   the vanilla leg (pg_vector_executor.md §6.4): the
#                       port's build of REL_19_STABLE, cloudberry/pg19-vanilla,
#                       with a C toolchain and PostgreSQL's regression suite;
#                       with VEXEC_NOASSERT=1, its build without assertions,
#                       cloudberry/pg19-vanilla-noassert, under the tag
#                       vanilla-noassert
#   vexec-dev-port      the port: pg_accel/cb-ext at CB_COMMIT, VB's build of
#                       the port's modules on the patched server, with a C
#                       toolchain; with VEXEC_NOASSERT=1 (run.sh), for timed
#                       runs, cb-ext-noassert's, the server and the port's
#                       modules without assertions and ORCA without
#                       GPOS_DEBUG, under the tag portnoassert-<commit>
#
# The checkouts are build contexts: PG_SRC, the build's clone of the port's
# fork of PostgreSQL (~/.cache/pg_accel/postgres, test/vexec/checkouts.sh),
# for the regression suite at the server's own commit.

name: pg_accel_vexec

x-dev: &dev
  context: .
  dockerfile: Dockerfile.vexec
  additional_contexts:
    pgsrc: ${PG_SRC:-${HOME}/.cache/pg_accel/postgres}

# A suite's container: the tree read-only, and a scratch directory of its
# own for the builds and the servers.  Within the port's tests' memory cap
# (§6.7), without swap; /dev/shm for parallel query.  VEXEC_CPUS bounds the
# CPUs it may use, so that a suite run beside a timed one stays out of its
# way.
x-run: &run
  user: postgres
  # The servers listen on sockets in their own directories only; no network.
  network_mode: none
  shm_size: 2gb
  mem_limit: ${CB_TESTS_MEM:-40g}
  memswap_limit: ${CB_TESTS_MEM:-40g}
  cpus: ${VEXEC_CPUS:-0}
  tmpfs:
    - /tmp:exec
  volumes:
    - ..:/src:ro
    - ${VEXEC_WORK:-/nonexistent}:/work
    - ${VEXEC_PORT_STAGE:-/nonexistent}:/cbstage:ro
    # the port's sources, whose own tests a leg may run (shm.sh: pg19/test/ic)
    - ${VEXEC_PORT_SRC:-/nonexistent}:/cbsrc:ro
  environment:
    VEXEC_SRC: /src
    VEXEC_WORK: /work
    CB_SRC_MOUNT: ${CB_SRC_MOUNT:-}
    VEXEC_ORCA_SECTIONS: ${VEXEC_ORCA_SECTIONS:-}
    # the legs' own settings, passed through when the host sets them
    VEXEC_SEED: ${VEXEC_SEED:-}
    VEXEC_CORPORA: ${VEXEC_CORPORA:-}
    VEXEC_SESSIONS: ${VEXEC_SESSIONS:-}
    VEXEC_ROWS: ${VEXEC_ROWS:-}
    VEXEC_STORAGES: ${VEXEC_STORAGES:-}
    VEXEC_SOURCES: ${VEXEC_SOURCES:-}
    VEXEC_SEGMENTS: ${VEXEC_SEGMENTS:-}
    VEXEC_PRELOAD: ${VEXEC_PRELOAD:-}
    VEXEC_SETTINGS: ${VEXEC_SETTINGS:-}
    VEXEC_PG_MODES: ${VEXEC_PG_MODES:-}
    VEXEC_PG_SCHEDULE: ${VEXEC_PG_SCHEDULE:-}
    VEXEC_PORT_SUITES: ${VEXEC_PORT_SUITES:-}
    VEXEC_PORT_PASSES: ${VEXEC_PORT_PASSES:-}
    VEXEC_PORT_SESSIONS: ${VEXEC_PORT_SESSIONS:-}
    VEXEC_INTERCONNECT: ${VEXEC_INTERCONNECT:-}
    VEXEC_SHM_PARTS: ${VEXEC_SHM_PARTS:-}
    MAKE_JOBS: ${MAKE_JOBS:-4}

services:
  vexec-dev-vanilla:
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}
    build:
      <<: *dev
      args:
        BASE_IMAGE: ${PG_VANILLA_IMAGE:-cloudberry/pg19-vanilla${VEXEC_CBEXT_SUFFIX:-}:latest}
    profiles: ["build"]

  vexec-dev-port:
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-${CB_COMMIT:-unset}
    build:
      <<: *dev
      args:
        BASE_IMAGE: pg_accel/cb-ext${VEXEC_CBEXT_SUFFIX:-}:${CB_COMMIT:-unset}
    profiles: ["build"]

  # pyarrow on vexec's dev images (V7_0, V10): the IPC codec's streams are
  # checked against Arrow's own implementation, both ways, and the egress
  # API's results read by it (Dockerfile.arrow).
  vexec-dev-vanillaarrow:
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}-arrow
    build:
      context: .
      dockerfile: Dockerfile.arrow
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}
    profiles: ["build"]

  vexec-dev-portarrow:
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-arrow-${CB_COMMIT:-unset}
    build:
      context: .
      dockerfile: Dockerfile.arrow
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-${CB_COMMIT:-unset}
    profiles: ["build"]

  # The port's build tools on vexec's dev image of the port: the port's
  # modules built from its sources (VEXEC_PORT_SRC) by the portbuild service.
  vexec-dev-portdev:
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}dev-${CB_COMMIT:-unset}
    build:
      context: .
      dockerfile: Dockerfile.portdev
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-${CB_COMMIT:-unset}
    profiles: ["build"]

  # The port's modules built from VEXEC_PORT_SRC -- the build's checkout of the
  # port (test/vexec/checkouts.sh), or a phase's worktree of it -- into
  # VEXEC_PORT_BUILD, and staged there for the legs (test/vexec/portbuild.sh).
  # PAX's two submodules, which a worktree does not check out, are the
  # checkout's (VEXEC_PAX_CONTRIB), mounted over their directories.
  portbuild:
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}dev-${CB_COMMIT:-unset}
    user: postgres
    network_mode: none
    entrypoint: ["/src/test/vexec/portbuild.sh"]
    mem_limit: ${VEXEC_PORTBUILD_MEM:-16g}
    memswap_limit: ${VEXEC_PORTBUILD_MEM:-16g}
    cpus: ${VEXEC_CPUS:-0}
    tmpfs:
      - /tmp:exec
    volumes:
      - ..:/src:ro
      - ${VEXEC_PORT_SRC:-/nonexistent}:/cbsrc:ro
      - ${VEXEC_PAX_CONTRIB:-/nonexistent}/tabulate:/cbsrc/contrib/pax_storage/src/cpp/contrib/tabulate:ro
      - ${VEXEC_PAX_CONTRIB:-/nonexistent}/googletest:/cbsrc/contrib/pax_storage/src/cpp/contrib/googletest:ro
      - ${VEXEC_PORT_BUILD:-/nonexistent}:/cbbuild
    environment:
      PORTBUILD_JOBS: ${PORTBUILD_JOBS:-8}
      PORTBUILD_COMMIT: ${PORTBUILD_COMMIT:-unknown}
    profiles: ["run"]

  # V6 (pg_vector_executor.md §3.3.5): ORCA on vanilla PostgreSQL 19.  vexec's
  # vanilla image with what the port's gp_orca needs to be built and run
  # there, and DuckDB, from the port's image, for the tpc suite.
  vexec-dev-vanillaorca:
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}-orca
    build:
      context: .
      dockerfile: Dockerfile.vanillaorca
      args:
        BASE_IMAGE: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}
        DUCKDB_IMAGE: pg_accel/cb-ext${VEXEC_CBEXT_SUFFIX:-}:${CB_COMMIT:-unset}
    profiles: ["build"]

  # gp_orca built alone, for one node without gp_core (-Dorca_single_node),
  # from VEXEC_PORT_SRC against the vanilla server, into VEXEC_ORCA_BUILD,
  # and staged there for the vanilla-orca leg (test/vexec/orcabuild.sh).
  orcabuild:
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}-orca
    user: postgres
    network_mode: none
    entrypoint: ["/src/test/vexec/orcabuild.sh"]
    mem_limit: ${VEXEC_PORTBUILD_MEM:-16g}
    memswap_limit: ${VEXEC_PORTBUILD_MEM:-16g}
    cpus: ${VEXEC_CPUS:-0}
    tmpfs:
      - /tmp:exec
    volumes:
      - ..:/src:ro
      - ${VEXEC_PORT_SRC:-/nonexistent}:/cbsrc:ro
      - ${VEXEC_ORCA_BUILD:-/nonexistent}:/cbbuild
    environment:
      PORTBUILD_JOBS: ${PORTBUILD_JOBS:-8}
      PORTBUILD_COMMIT: ${PORTBUILD_COMMIT:-unknown}
    profiles: ["run"]

  vanilla:
    <<: *run
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}
    profiles: ["run"]

  # The vanilla server with gp_orca built alone (VEXEC_ORCA_STAGE), which
  # build.sh installs over the server's tree; and the port's sources it was
  # built from, whose ORCA comparison of PostgreSQL's suite orca.sh reuses.
  vanilla-orca:
    <<: *run
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}-orca
    volumes:
      - ..:/src:ro
      - ${VEXEC_WORK:-/nonexistent}:/work
      - ${VEXEC_ORCA_STAGE:-/nonexistent}:/orcastage:ro
      - ${VEXEC_PORT_SRC:-/nonexistent}:/cbsrc:ro
    profiles: ["run"]

  port:
    <<: *run
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-${CB_COMMIT:-unset}
    profiles: ["run"]

  # The two legs with pyarrow (V7_0, V10).
  vanilla-arrow:
    <<: *run
    image: pg_accel/vexec-dev:${VEXEC_VANILLA_FLAVOR:-vanilla}-arrow
    profiles: ["run"]

  port-arrow:
    <<: *run
    image: pg_accel/vexec-dev:${VEXEC_PORT_FLAVOR:-port}-arrow-${CB_COMMIT:-unset}
    profiles: ["run"]

  # The port's full run with vexec on every node (test/vexec/fullrun.sh), as
  # the port's own tests service runs its suites (pg19/docker/compose.yml):
  # privileged and as root for the resource group suite's cgroups, /tmp a
  # tmpfs, within the tests' memory cap, and a disk for that suite's
  # clusters.
  #
  # On a project's network, as the tests service is.  This host has no
  # address pool left for a network of this project's own, so it joins
  # pg_accel_default, VB's (compose.yml), made when VB's containers first
  # ran.  Not Docker's default bridge: there the container's resolver is the
  # host's router, and a name that does not exist fails as "No address
  # associated with hostname", which the port's external_table test does
  # not expect; Docker's own resolver on a project's network fails it as
  # the test expects.
  fullrun:
    image: pg_accel/vexec-dev:port-${CB_COMMIT:-unset}
    user: root
    privileged: true
    entrypoint: ["/src/test/vexec/fullrun.sh"]
    networks: [pg_accel]
    shm_size: 4gb
    tmpfs:
      - /tmp
    mem_limit: ${CB_TESTS_MEM:-40g}
    memswap_limit: ${CB_TESTS_MEM:-40g}
    volumes:
      - /var/lib/cbdisk
      - ..:/src:ro
      - ${VEXEC_WORK:-/nonexistent}:/work
      - ${VEXEC_PORT_STAGE:-/nonexistent}:/cbstage:ro
    environment:
      VEXEC_FULLRUN_PRELOAD: ${VEXEC_FULLRUN_PRELOAD:-1}
      RESULTS_DIR: /work/fullrun-${VEXEC_FULLRUN_PRELOAD:-1}
    profiles: ["run"]

networks:
  pg_accel:
    external: true
    name: pg_accel_default
